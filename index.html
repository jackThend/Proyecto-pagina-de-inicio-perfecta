<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Página de Inicio Definitiva</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/customParseFormat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/localizedFormat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/es.js"></script>
</head>
<body>

  <div class="background-manager"></div>

  <div class="page-container">
    <header class="top-bar">
      <div id="clock-widget" class="widget-container">
        <div class="time"></div>
        <div class="date"></div>
      </div>
      <div id="search-widget" class="widget-container">
        <form id="search-form">
          <input type="text" placeholder="Buscar o navegar a URL" />
        </form>
      </div>
      <div id="weather-widget" class="widget-container">
        <div class="main-weather"></div>
        <div class="forecast"></div>
      </div>
      <div class="controls">
        <button id="toggle-edit-mode" title="Modo Edición">⚙️</button>
        <button id="toggle-theme" title="Cambiar Tema">🎨</button>
      </div>
    </header>

    <main id="widget-grid" class="widget-grid"></main>

    <div id="widget-picker" class="widget-picker" style="display: none;">
      <h3>Añadir Widget</h3>
      <div class="widget-list">
        <button data-widget-type="calendar">Calendario</button>
        <button data-widget-type="tasks">Tareas</button>
        <button data-widget-type="rss">Feed RSS</button>
        <button data-widget-type="deals">Ofertas de Juegos</button>
      </div>
      <button id="close-picker">Cerrar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
